55, 255, 255, 0.6)}body,html{margin:0;padding:0;width:100%;height:100%;background-color:var(--bg-color);font-family:Inter,sans-serif;color:var(--text-main);overflow:hidden;display:flex;flex-direction:column;overscroll-behavior-y:contain}.viewer-header{display:flex;align-items:center;justify-content:space-between;background:rgba(26,26,46,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:.75rem 1.5rem;z-index:100;height:60px;box-sizing:border-box}.header-left{display:flex;align-items:center;gap:1rem}.brand-logo{height:32px;width:32px;border-radius:8px;object-fit:cover;box-shadow:0 0 12px rgba(0,210,255,.3)}.note-info{display:flex;flex-direction:column}.note-title{font-size:1rem;font-weight:600;color:#fff;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.note-meta{font-size:.75rem;color:var(--text-dim);margin-top:.15rem}.header-right{display:flex;align-items:center;gap:.75rem}.btn-action{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}.btn-action:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,var(--primary),#9d50bb);border:none;box-shadow:0 4px 15px rgba(108,99,255,.25)}.btn-primary:hover{background:linear-gradient(135deg,#7b73ff,#a860c6);box-shadow:0 6px 20px rgba(108,99,255,.4)}.viewer-content{flex:1;width:100%;position:relative;background:#111;overflow:hidden}iframe{width:100%;height:100%;border:none;display:block}.status-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-color);z-index:10}.skil-viewer-loader{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center}.loader-ring{position:absolute;border-radius:50%;box-sizing:border-box}.loader-ring.outer-ring{width:100%;height:100%;border:2px solid rgba(255,255,255,.07);border-top-color:rgba(255,255,255,.85);border-right-color:rgba(129,140,248,.6);animation:skilViewerSpinOuter 1.2s cubic-bezier(.4,0,.2,1) infinite}.loader-ring.inner-ring{width:62%;height:62%;border:2px solid transparent;border-bottom-color:rgba(129,140,248,.85);border-left-color:rgba(255,255,255,.4);animation:skilViewerSpinInner .9s cubic-bezier(.4,0,.2,1) infinite reverse}.loader-core{width:5px;height:5px;background:rgba(255,255,255,.75);border-radius:50%;animation:skilViewerPulseCore 1.5s ease-in-out infinite}@keyframes skilViewerSpinOuter{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@keyframes skilViewerSpinInner{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@keyframes skilViewerPulseCore{0%,100%{transform:scale(.75);opacity:.35}50%{transform:scale(1.15);opacity:.9}}.skil-loading-text{margin-top:1.25rem;color:#94a3b8;font-size:.88rem;font-weight:500;letter-spacing:.5px;display:flex;align-items:center;justify-content:center}.wavy-dots{display:inline-flex;gap:3px;margin-left:2px}.wavy-dots span{display:inline-block;color:#818cf8;font-size:1.1rem;font-weight:700;line-height:1;animation:skilWaveDot 1.4s infinite cubic-bezier(.4,0,.2,1)}.wavy-dots span:nth-child(1){animation-delay:0s}.wavy-dots span:nth-child(2){animation-delay:.2s}.wavy-dots span:nth-child(3){animation-delay:.4s}@keyframes skilWaveDot{0%,100%,60%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1;color:#a5b4fc}}.error-message{color:#ff6b6b;text-align:center;max-width:400px;padding:2rem;background:rgba(255,107,107,.05);border:1px solid rgba(255,107,107,.2);border-radius:12px;display:none}#office-blocker{display:none;position:absolute;bottom:0;right:0;width:200px;height:45px;z-index:100;background:0 0}@media (max-width:600px){.viewer-header{padding:.5rem .75rem}.header-left{gap:.5rem}.brand-logo{height:28px;width:28px}.note-title{max-width:100px;font-size:.85rem}.note-meta{display:none}#page-indicator{margin-right:8px!important;padding:.3rem .5rem!important;font-size:.8rem}.vote-container{margin-right:8px!important;padding-right:8px!important;gap:4px!important}.btn-action.view-count-display{padding:.4rem .5rem!important}.btn-action span:not(#view-count-display){display:none}.btn-action{padding:.4rem .5rem}.hide-mobile{display:none!important}}.zoom-btn:hover{background:rgba(255,255,255,.15)!important;transform:scale(1.05)}.zoom-btn:active{transform:scale(.95)}</style><script type="application/ld+json">{

d:#0f111a;z-index:50"><div class="error-message" id="error-msg"></div></div><iframe id="office-frame" sandbox="allow-scripts allow-same-origin allow-forms" style="display:none;width:100%;height:100%;border:none;background:#fff;overscroll-behavior:contain"></iframe><div id="pdf-container" style="display:none;width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding:20px 10px;background:#0f111a;touch-action:pan-x pan-y;overscroll-behavior:contain;overscroll-behavior-y:contain"></div><div id="office-blocker" title="Action disabled by administrator"></div></div><script type="module">import { supabase } from '../js/supabase-config.js?v=mugvub81-qilu';
        import { globalNotes } from '../data/globalNotes.js?v=mugvub81-qilu';

        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

        const sb = supabase;

        // Mobile performance optimization variables
        const isMobile = (window.innerWidth < 768) || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const MAX_CONCURRENT_RENDERS = isMobile ? 1 : 2;
        let activeRenders = 0;
        const renderQueue = [];

        function findStaticNote(id) {
            for (const college in globalNotes) {
                for (const subject in globalNotes[college]) {
                    const notes = globalNotes[college][subject];
                    const found = notes.find(n => n.id === id);
                    if (found) return found;
                }
            }
            return null;
        }

        async function loadNote() {
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('id');
            const legacyUrlBase64 = params.get('u');
            const legacyTitleBase64 = params.get('t');

            // Handle legacy preview links that use ?u=(base64) & t=(base64)
            if (legacyUrlBase64) {
                try {
                    const decodedUrl = decodeURIComponent(atob(legacyUrlBase64));
                    const decodedTitle = legacyTitleBase64 ? decodeURIComponent(atob(legacyTitleBase64)) : 'Document';

                    document.title = `${decodedTitle} | SKiL MATRiX Viewer`;
                    document.getElementById('ui-title').innerText = decodedTitle;
                    document.getElementById('ui-meta').innerText = `Direct View`;

                    const btnDownload = document.getElementById('btn-download');
                    btnDownload.style.display = 'inline-flex';
                    btnDownload.onclick = function (e) {
                        e.preventDefault();
                        window.forceDownload(decodedUrl, `${decodedTitle}.pdf`);
                    };

                    const btnShare = document.getElementById('btn-share');
                    btnShare.style.display = 'inline-flex';

                    let finalUrl = decodedUrl;
                    if (finalUrl.includes('drive.google.com')) {
                        showDriveLink(finalUrl);
                        return;
                    }
                    if (finalUrl.toLowerCase().match(/\.(ppt|pptx|doc|docx|xls|xlsx)(\?|$)/)) {
                        renderOffice(finalUrl);
                    } else {
                        renderPDF(finalUrl);
                    }
                    return;
                } catch (e) {
                    console.error("Failed to decode direct URL", e);
                }
            }

            if (!noteId) {
                showError("Invalid link. No resource ID provided.");
                return;
            }

            try {
                let noteData = null;

                // 1. Check if it's an old static note from globalNotes.js
                const staticNote = findStaticNote(noteId);

                if (staticNote) {
                    noteData = {
                        title: staticNote.title || staticNote.subjectName,
                        subject: staticNote.subject || staticNote.subjectName,
                        uploader_name: 'SKiL MATRiX Admin',
                        file_url: staticNote.url || staticNote.fileUrl || staticNote.driveLink
                    };
                } else {
                    // 2. Fetch directly from primary Supabase first for instant load
                    try {
                        const { data, error } = await sb.from('approved_notes').select('*').eq('id', noteId).single();
                        if (!error && data) {
                            noteData = data;
                            noteData.views = (noteData.views || 0) + 1; // optimistically update local UI
                            window._currentNoteClient = sb;
                        }
                    } catch (e) {
                        console.warn("Primary DB lookup failed:", e);
                    }

                    // 3. Fallback to federated databases if not found in primary
                    if (!noteData) {
                        try {
                            const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                                ? ''
                                : 'https://skil-matrix-server.onrender.com';
                            const configRes = await fetch(`${API_BASE}/api/storage-config`);
                            const configData = await configRes.json();

                            const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');

                            for (const db of configData.databases) {
                                const client = createClient(db.url, db.anonKey);
                                const { data, error } = await client.from('approved_notes').select('*').eq('id', noteId).single();
                                if (!error && data) {
                                    noteData = data;
                                    noteData.views = (noteData.views || 0) + 1;
                                    window._currentNoteClient = client;
                                    break;
                                }
                            }
                        } catch (e) {
                            console.error("Federated DB search failed:", e);
                        }
                    }
                }

                if (!noteData) {
                    console.error("Note not found locally or in DB.");
                    showError("Resource not found or has been removed.");
                    return;
                }

                // Update UI
                document.title = `${noteData.title} | SKiL MATRiX Viewer`;
                document.getElementById('ui-title').innerText = noteData.title || 'Untitled Note';
                document.getElementById('ui-meta').innerText = `Uploaded by ${noteData.uploader_name || 'Verified'}`;

                const btnDownload = document.getElementById('btn-download');
                if (noteData.allow_download !== false) {
                    btnDownload.style.display = 'inline-flex';
                    btnDownload.onclick = function (e) {
                        e.preventDefault();
                        window.forceDownload(noteData.file_url, `${noteData.title}.pdf`);
                    };
                } else {
                    btnDownload.style.display = 'none';
                }

                const voteContainer = document.getElementById('vote-container');
                if (voteContainer) voteContainer.style.display = 'flex';

                const viewCountEl = document.getElementById('view-count-display');
                if (viewCountEl) viewCountEl.innerText = noteData.views || 0;

                const btnShare = document.getElementById('btn-share');
                btnShare.style.display = 'inline-flex';

                // Dynamically update OG tags via JS
                try {
                    document.querySelector('meta[property="og:title"]').setAttribute("content", `${noteData.title} | SKiL MATRiX`);
                } catch (e) { }

                // Load viewer content
                let finalUrl = noteData.file_url;
                window._currentNoteFileUrl = finalUrl;
                if (finalUrl.includes('drive.google.com') || finalUrl.includes('docs.google.com') || finalUrl.includes('drive.usercontent.google.com')) {
                    showDriveLink(finalUrl);
                    window.location.replace(finalUrl);
                    return;
                }

                const finalUrlLower = finalUrl.toLowerCase();
                if (finalUrlLower.match(/\.(ppt|pptx|doc|docx|xls|xlsx)(\?|$)/)) {
                    renderOffice(finalUrl);
                } else {
                    renderPDF(finalUrl);
                }

                // Track View (Increment every time as requested)
                try {
                    await (window._currentNoteClient || sb).rpc('increment_note_view', { p_note_id: noteId });
                } catch (e) { console.error('View tracking failed', e); }

            } catch (err) {
                console.error(err);
                showError("A connection error occurred. Please try again.");
            }
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error-overlay');
            const errMsg = document.getElementById('error-msg');
            errDiv.style.display = 'flex';
            errMsg.style.display = 'block';
            errMsg.innerHTML = `<i class="fas fa-exclamation-triangle" style="font-size:2rem; margin-bottom:1rem; display:block"></i> ${msg}`;
        }

        function showDriveLink(url) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error-overlay');
            const errMsg = document.getElementById('error-msg');
            errDiv.style.display = 'flex';
            errMsg.style.display = 'block';

            errMsg.style.background = 'rgba(0, 255, 136, 0.05)';
            errMsg.style.borderColor = 'rgba(0, 255, 136, 0.2)';
            errMsg.style.color = 'var(--text-bright)';
            errMsg.style.maxWidth = '500px';

            errMsg.innerHTML = `
                <i class="fab fa-google-drive" style="font-size:3.5rem; margin-bottom:1.5rem; display:block; color:#00ff88"></i>
                <h3 style="margin-bottom: 1rem; font-size:1.5rem;">Google Drive Resource</h3>
                <p style="color:var(--text-dim); margin-bottom: 2rem; font-size:1rem; line-height:1.5;">This file is stored securely on Google Drive and cannot be embedded directly in the viewer.</p>
                <a href="${url}" target="_blank" class="btn-action btn-primary" style="display:inline-flex; padding:0.9rem 2rem; text-decoration:none; border-radius:10px; font-weight:600; font-size:1.1rem;">
                    Open in Google Drive <i class="fas fa-external-link-alt" style="margin-left: 8px;"></i>
                </a>
            `;
        }

        window.forceDownload = async function (url, filename) {
            try {
                const btn = document.getElementById('btn-download');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Downloading...</span>';

                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = objectUrl;
                a.download = filename || 'document.pdf';
                document.body.appendChild(a);
                a.click();

                document.body.removeChild(a);
                URL.revokeObjectURL(objectUrl);

                btn.innerHTML = originalHTML;
            } catch (e) {
                console.error("Forced download failed, falling back to new tab", e);
                window.open(url, '_blank');
                const btn = document.getElementById('btn-download');
                btn.innerHTML = '<i class="fas fa-download"></i> <span>Download</span>';
            }
        };

        window.shareNote = function () {
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const baseUrl = isLocal ? window.location.origin : 'https://skilmatrix.site';
            const urlParams = new URLSearchParams(window.location.search);
            const noteId = urlParams.get('id');
            const url = noteId ? (baseUrl + '/share/' + noteId) : (baseUrl + window.location.pathname + window.location.search);

            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: 'Check out this study resource on SKiL MATRiX!',
                    url: url
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    alert("Link copied to clipboard!");
                });
            }
        };

        function renderOffice(url) {
            const officeFrame = document.getElementById('office-frame');
            const officeBlocker = document.getElementById('office-blocker');
            const loader = document.getElementById('loader');
            const pdfContainer = document.getElementById('pdf-container');
            const errOverlay = document.getElementById('error-overlay');

            if (pdfContainer) pdfContainer.style.display = 'none';
            if (errOverlay) errOverlay.style.display = 'none';

            const isPdf = url.toLowerCase().split(/[#?]/)[0].endsWith('.pdf');
            if (isPdf) {
                renderPDF(url);
                return;
            }

            let embedUrl = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/file\/d\/([^\/]+)/) || url.match(/[?&]id=([^&]+)/);
                if (match && match[1]) {
                    embedUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }

            officeFrame.src = embedUrl;
            officeFrame.style.display = 'block';

            if (officeBlocker) {
                officeBlocker.style.bottom = 'auto';
                officeBlocker.style.top = '0';
                officeBlocker.style.right = '0';
                officeBlocker.style.width = '60px';
                officeBlocker.style.height = '60px';
                officeBlocker.style.display = 'block';
            }

            officeFrame.onload = () => {
                loader.style.display = 'none';
            };

            setTimeout(() => {
                loader.style.display = 'none';
            }, 2500);
        }

        let zoomLevel = 100;

        function applyZoom() {
            const wrappers = document.querySelectorAll('.pdf-page-wrapper');
            const container = document.getElementById('pdf-container');
            const containerWidth = Math.max(200, (container.clientWidth || window.innerWidth) - 30);
            const baseWidth = Math.min(containerWidth, 900);
            const cssWidth = baseWidth * (zoomLevel / 100);

            wrappers.forEach(wrapper => {
                const aspectRatio = parseFloat(wrapper.dataset.aspectRatio) || 1.414;
                wrapper.style.minHeight = `${cssWidth * aspectRatio}px`;
                const canvas = wrapper.querySelector('canvas');
                if (canvas) {
                    canvas.style.width = `${cssWidth}px`;
                    canvas.style.height = `${cssWidth * aspectRatio}px`;
                }
                delete wrapper.dataset.rendered;
                delete wrapper.dataset.rendering;
            });
        }

        // Touch Pinch-to-Zoom & Double-Tap Zoom with Accidental Click Guard
        (function() {
            const container = document.getElementById('pdf-container');
            let initialTouchDistance = 0;
            let initialZoom = 100;
            let lastTapTime = 0;
            let startY = 0;
            let isPinchingOrScrolling = false;
            let pinchLockTimeout = null;

            // Global capturing click listener to block accidental link clicks during/after pinch zoom
            window.addEventListener('click', (e) => {
                if (isPinchingOrScrolling) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
            }, true);

            function reRenderVisiblePages() {
                if (!window._currentPdfDoc) return;
                const pdf = window._currentPdfDoc;
                const container = document.getElementById('pdf-container');
                if (!container) return;
                const containerRect = container.getBoundingClientRect();

                document.querySelectorAll('.pdf-page-wrapper').forEach(wrapper => {
                    const rect = wrapper.getBoundingClientRect();
                    const isVisible = (rect.bottom >= containerRect.top - 400) && (rect.top <= containerRect.bottom + 400);
                    if (isVisible) {
                        delete wrapper.dataset.rendered;
                        delete wrapper.dataset.rendering;
                        const pageNum = parseInt(wrapper.dataset.pageNumber);
                        queueRenderPage(pdf, pageNum, wrapper);
                    }
                });
            }

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    isPinchingOrScrolling = true;
                    if (pinchLockTimeout) clearTimeout(pinchLockTimeout);
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialTouchDistance = Math.sqrt(dx * dx + dy * dy);
                    initialZoom = zoomLevel;
                } else if (e.touches.length === 1) {
                    startY = e.touches[0].clientY;
                    const now = Date.now();
                    if (now - lastTapTime < 280) {
                        if (zoomLevel > 105) {
                            zoomLevel = 100;
                        } else {
                            zoomLevel = 150;
                        }
                        applyZoom();
                        reRenderVisiblePages();
                    }
                    lastTapTime = now;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialTouchDistance > 0) {
                    isPinchingOrScrolling = true;
                    if (pinchLockTimeout) clearTimeout(pinchLockTimeout);
                    if (e.cancelable) e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const currentDistance = Math.sqrt(dx * dx + dy * dy);
                    
                    const ratio = currentDistance / initialTouchDistance;
                    let targetZoom = Math.round((initialZoom * ratio) / 5) * 5;
                    targetZoom = Math.max(50, Math.min(300, targetZoom));
                    
                    if (targetZoom !== zoomLevel) {
                        zoomLevel = targetZoom;
                        applyZoom();
                    }
                } else if (e.touches.length === 1) {
                    const currentY = e.touches[0].clientY;
                    const deltaY = currentY - startY;
                    // Prevent browser pull-to-refresh reload when swiping down at top of page
                    if (container.scrollTop <= 0 && deltaY > 0) {
                        if (e.cancelable) e.preventDefault();
                    }
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    if (initialTouchDistance > 0) {
                        initialTouchDistance = 0;
                        if (pinchLockTimeout) clearTimeout(pinchLockTimeout);
                        // Hold click guard active for 350ms after fingers release to absorb accidental touch taps
                        pinchLockTimeout = setTimeout(() => {
                            isPinchingOrScrolling = false;
                        }, 350);

                        reRenderVisiblePages();
                    }
                }
            }, { passive: true });

            container.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) {
                        if (zoomLevel < 300) {
                            zoomLevel = Math.min(300, zoomLevel + 10);
                            applyZoom();
                            reRenderVisiblePages();
                        }
                    } else {
                        if (zoomLevel > 50) {
                            zoomLevel = Math.max(50, zoomLevel - 10);
                            applyZoom();
                            reRenderVisiblePages();
                        }
                    }
                }
            }, { passive: false });
        })();

        // --- HIGH PERFORMANCE MOBILE PDF RENDERER ---
        function cancelWrapperRender(wrapper) {
            if (wrapper._renderTask) {
                try {
                    wrapper._renderTask.cancel();
                } catch (e) {}
                wrapper._renderTask = null;
            }
            const idx = renderQueue.findIndex(q => q.wrapper === wrapper);
            if (idx !== -1) {
                renderQueue.splice(idx, 1);
            }
            delete wrapper.dataset.rendering;
            if (!wrapper.querySelector('canvas')) {
                delete wrapper.dataset.rendered;
            }
        }

        function unloadWrapper(wrapper) {
            // Keep rendered pages intact during scroll to avoid flickering/reloading
            // Only cancel active pending render if wrapper scrolls out before drawing completes
            if (wrapper._renderTask) {
                try {
                    wrapper._renderTask.cancel();
                } catch (e) {}
                wrapper._renderTask = null;
            }
            const idx = renderQueue.findIndex(q => q.wrapper === wrapper);
            if (idx !== -1) {
                renderQueue.splice(idx, 1);
            }
            delete wrapper.dataset.rendering;
            if (!wrapper.querySelector('canvas')) {
                delete wrapper.dataset.rendered;
            }
        }

        function processRenderQueue() {
            while (activeRenders < MAX_CONCURRENT_RENDERS && renderQueue.length > 0) {
                const item = renderQueue.shift();
                if (!document.body.contains(item.wrapper)) {
                    delete item.wrapper.dataset.rendering;
                    continue;
                }
                activeRenders++;
                executeRenderPage(item.pdf, item.pageNum, item.wrapper).finally(() => {
                    activeRenders--;
                    processRenderQueue();
                });
            }
        }

        function queueRenderPage(pdf, pageNum, wrapper) {
            cancelWrapperRender(wrapper);
            wrapper.dataset.rendering = 'true';

            const existingIdx = renderQueue.findIndex(q => q.wrapper === wrapper);
            if (existingIdx !== -1) {
                renderQueue.splice(existingIdx, 1);
            }

            renderQueue.push({ pdf, pageNum, wrapper });
            processRenderQueue();
        }

        async function executeRenderPage(pdf, pageNum, wrapper) {
            try {
                if (!document.body.contains(wrapper)) {
                    delete wrapper.dataset.rendering;
                    return;
                }

                const page = await pdf.getPage(pageNum);

                const container = document.getElementById('pdf-container');
                const containerWidth = Math.max(200, (container.clientWidth || window.innerWidth) - 30);
                const baseWidth = Math.min(containerWidth, 900);
                const cssWidth = baseWidth * (zoomLevel / 100);

                const unscaledViewport = page.getViewport({ scale: 1.0 });
                const aspectRatio = unscaledViewport.height / unscaledViewport.width;
                wrapper.dataset.aspectRatio = aspectRatio.toString();

                const rawDpr = window.devicePixelRatio || 1;
                const dpr = isMobile ? Math.min(rawDpr, 2.0) : Math.min(rawDpr, 2.0);

                const renderScale = (cssWidth / unscaledViewport.width) * dpr;
                const viewport = page.getViewport({ scale: renderScale });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d', { alpha: false });

                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);

                canvas.style.width = `${cssWidth}px`;
                canvas.style.height = `${cssWidth * aspectRatio}px`;
                canvas.style.display = 'inline-block';
                canvas.style.margin = '0 auto';
                canvas.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
                canvas.style.borderRadius = '4px';

                wrapper.style.minHeight = `${cssWidth * aspectRatio}px`;

                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);

                const renderTask = page.render({
                    canvasContext: context,
                    viewport: viewport
                });
                wrapper._renderTask = renderTask;

                await renderTask.promise;

                // Only append completed canvas to DOM once render task completes cleanly
                if (document.body.contains(wrapper)) {
                    const oldCanvas = wrapper.querySelector('canvas');
                    if (oldCanvas) {
                        oldCanvas.width = 0;
                        oldCanvas.height = 0;
                    }
                    wrapper.innerHTML = '';
                    wrapper.appendChild(canvas);
                    wrapper.dataset.rendered = 'true';
                }
            } catch (e) {
                if (e && (e.name === 'RenderingCancelledException' || e.message === 'Rendering cancelled')) {
                    // Render was cancelled during scroll or zoom
                } else {
                    console.error(`Page ${pageNum} render error:`, e);
                }
            } finally {
                wrapper._renderTask = null;
                delete wrapper.dataset.rendering;
                if (!wrapper.querySelector('canvas')) {
                    delete wrapper.dataset.rendered;
                }
            }
        }

        async function renderPDF(url) {
            const container = document.getElementById('pdf-container');
            const officeFrame = document.getElementById('office-frame');
            const pageIndicator = document.getElementById('page-indicator');
            const loader = document.getElementById('loader');

            if (officeFrame) officeFrame.style.display = 'none';
            container.style.display = 'block';
            pageIndicator.style.display = 'flex';

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                window._currentPdfDoc = pdf;

                document.getElementById('total-pages').innerText = pdf.numPages;
                loader.style.display = 'none';

                const containerWidth = Math.max(200, (container.clientWidth || window.innerWidth) - 30);
                const baseWidth = Math.min(containerWidth, 900);
                const cssWidth = baseWidth * (zoomLevel / 100);

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper';
                    wrapper.dataset.pageNumber = pageNum;
                    wrapper.style.marginBottom = '20px';
                    wrapper.style.minHeight = `${cssWidth * 1.414}px`;
                    wrapper.style.display = 'block';
                    wrapper.style.textAlign = 'center';
                    wrapper.style.width = '100%';

                    container.appendChild(wrapper);
                }

                const rootMargin = isMobile ? '250px 0px' : '400px 0px';
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const wrapper = entry.target;
                        const pageNum = parseInt(wrapper.dataset.pageNumber);

                        if (entry.isIntersecting) {
                            document.getElementById('current-page').innerText = pageNum;
                            if (!wrapper.dataset.rendered && !wrapper.dataset.rendering) {
                                queueRenderPage(pdf, pageNum, wrapper);
                            }
                        } else {
                            unloadWrapper(wrapper);
                        }
                    });
                }, { root: container, rootMargin: rootMargin });

                document.querySelectorAll('.pdf-page-wrapper').forEach(w => observer.observe(w));

            } catch (err) {
                console.error("PDF.js render failed:", err);
                if (url.includes('drive.google.com') || url.includes('docs.google.com') || url.includes('drive.usercontent.google.com')) {
                    showDriveLink(url);
                    window.location.replace(url);
                } else {
                    renderOffice(url);
                }
            }
        }
