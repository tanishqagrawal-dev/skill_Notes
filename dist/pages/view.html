t:40px;border:3px solid rgba(0,210,255,.2);border-top-color:var(--secondary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem}@keyframes spin{to{transform:rotate(360deg)}}.error-message{color:#ff6b6b;text-align:center;max-width:400px;padding:2rem;background:rgba(255,107,107,.05);border:1px solid rgba(255,107,107,.2);border-radius:12px;display:none}@media (max-width:600px){.note-title{max-width:150px;font-size:.9rem}.note-meta{display:none}.btn-action span:not(#view-count-display){display:none}.btn-action{padding:.5rem .6rem}.hide-mobile{display:none!important}}</style><script type="application/ld+json">{

ground:#222;text-align:center;padding:20px 0;box-sizing:border-box"></div><iframe id="office-frame" style="display:none;width:100%;height:100%;border:none;background:#fff"></iframe></div><script type="module">import { supabase } from '../js/supabase-config.js?v=ac637518';
        import { globalNotes } from '../data/globalNotes.js?v=ac637518';

        const sb = supabase;

        function findStaticNote(id) {
            for (const college in globalNotes) {
                for (const subject in globalNotes[college]) {
                    const notes = globalNotes[college][subject];
                    const found = notes.find(n => n.id === id);
                    if (found) return found;
                }
            }
            return null;
        }

        async function loadNote() {
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('id');
            const legacyUrlBase64 = params.get('u');
            const legacyTitleBase64 = params.get('t');

            // Handle legacy preview links that use ?u=(base64) & t=(base64)
            if (legacyUrlBase64) {
                try {
                    const decodedUrl = decodeURIComponent(atob(legacyUrlBase64));
                    const decodedTitle = legacyTitleBase64 ? decodeURIComponent(atob(legacyTitleBase64)) : 'Document';

                    document.title = `${decodedTitle} | SKiL MATRiX Viewer`;
                    document.getElementById('ui-title').innerText = decodedTitle;
                    document.getElementById('ui-meta').innerText = `Direct View`;

                    const btnDownload = document.getElementById('btn-download');
                    btnDownload.style.display = 'inline-flex';
                    btnDownload.onclick = function (e) {
                        e.preventDefault();
                        forceDownload(decodedUrl, `${decodedTitle}.pdf`);
                    };

                    const btnShare = document.getElementById('btn-share');
                    btnShare.style.display = 'inline-flex';

                    let finalUrl = decodedUrl;
                    if (finalUrl.includes('drive.google.com')) {
                        showDriveLink(finalUrl);
                        return;
                    }
                    if (finalUrl.toLowerCase().includes('.pdf')) {
                        renderPDF(finalUrl);
                    } else {
                        showError("Unsupported file format.");
                    }
                    return;
                } catch (e) {
                    console.error("Failed to decode direct URL", e);
                }
            }

            if (!noteId) {
                showError("Invalid link. No resource ID provided.");
                return;
            }

            try {
                let noteData = null;

                // 1. Check if it's an old static note from globalNotes.js
                const staticNote = findStaticNote(noteId);

                if (staticNote) {
                    noteData = {
                        title: staticNote.title || staticNote.subjectName,
                        subject: staticNote.subject || staticNote.subjectName,
                        uploader_name: 'SKiL MATRiX Admin',
                        file_url: staticNote.url || staticNote.fileUrl || staticNote.driveLink
                    };
                } else {
                    // 2. Fetch from all databases (Federated)
                    try {
                        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                            ? ''
                            : 'https://skil-matrix-server.onrender.com';
                        const configRes = await fetch(`${API_BASE}/api/storage-config`);
                        const configData = await configRes.json();

                        // Import dynamically to create multiple clients
                        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');

                        for (const db of configData.databases) {
                            const client = createClient(db.url, db.anonKey);
                            const { data, error } = await client.from('approved_notes').select('*').eq('id', noteId).single();
                            if (!error && data) {
                                noteData = data;
                                noteData.views = (noteData.views || 0) + 1; // optimistically update local UI
                                window._currentNoteClient = client; // Save the client to track views later
                                break;
                            }
                        }
                    } catch (e) {
                        console.error("Federated DB search failed:", e);
                    }
                }

                if (!noteData) {
                    console.error("Note not found locally or in DB.");
                    showError("Resource not found or has been removed.");
                    return;
                }

                // Update UI
                document.title = `${noteData.title} | SKiL MATRiX Viewer`;
                document.getElementById('ui-title').innerText = noteData.title || 'Untitled Note';
                document.getElementById('ui-meta').innerText = `Uploaded by ${noteData.uploader_name || 'Verified'}`;

                const btnDownload = document.getElementById('btn-download');
                if (noteData.allow_download !== false) {
                    btnDownload.style.display = 'inline-flex';
                    btnDownload.onclick = function (e) {
                        e.preventDefault();
                        window.forceDownload(noteData.file_url, `${noteData.title}.pdf`);
                    };
                } else {
                    btnDownload.style.display = 'none';
                }

                const voteContainer = document.getElementById('vote-container');
                if (voteContainer) voteContainer.style.display = 'flex';

                const viewCountEl = document.getElementById('view-count-display');
                if (viewCountEl) viewCountEl.innerText = noteData.views || 0;

                // Remove .html from share link dynamically
                const btnShare = document.getElementById('btn-share');
                btnShare.style.display = 'inline-flex';

                // Dynamically update OG tags via JS
                try {
                    document.querySelector('meta[property="og:title"]').setAttribute("content", `${noteData.title} | SKiL MATRiX`);
                } catch (e) { }

                // Load iframe securely
                let finalUrl = noteData.file_url;
                if (finalUrl.includes('drive.google.com')) {
                    showDriveLink(finalUrl);
                    return;
                }

                const finalUrlLower = finalUrl.toLowerCase();
                if (finalUrlLower.includes('.pdf')) {
                    renderPDF(finalUrl);
                } else if (finalUrlLower.match(/\.(ppt|pptx|doc|docx|xls|xlsx)(\?|$)/)) {
                    renderOffice(finalUrl);
                } else {
                    showError("Unsupported file format.");
                }

                // Track View (Increment every time as requested)
                try {
                    await (window._currentNoteClient || sb).rpc('increment_note_view', { p_note_id: noteId });
                } catch (e) { console.error('View tracking failed', e); }

            } catch (err) {
                console.error(err);
                showError("A connection error occurred. Please try again.");
            }
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error-overlay');
            const errMsg = document.getElementById('error-msg');
            errDiv.style.display = 'flex';
            errMsg.style.display = 'block';
            errMsg.innerHTML = `<i class="fas fa-exclamation-triangle" style="font-size:2rem; margin-bottom:1rem; display:block"></i> ${msg}`;
        }

        function showDriveLink(url) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error-overlay');
            const errMsg = document.getElementById('error-msg');
            errDiv.style.display = 'flex';
            errMsg.style.display = 'block';

            errMsg.style.background = 'rgba(0, 255, 136, 0.05)';
            errMsg.style.borderColor = 'rgba(0, 255, 136, 0.2)';
            errMsg.style.color = 'var(--text-bright)';
            errMsg.style.maxWidth = '500px';

            errMsg.innerHTML = `
                <i class="fab fa-google-drive" style="font-size:3.5rem; margin-bottom:1.5rem; display:block; color:#00ff88"></i>
                <h3 style="margin-bottom: 1rem; font-size:1.5rem;">Google Drive Resource</h3>
                <p style="color:var(--text-dim); margin-bottom: 2rem; font-size:1rem; line-height:1.5;">This file is stored securely on Google Drive and cannot be embedded directly in the viewer.</p>
                <a href="${url}" target="_blank" class="btn-action btn-primary" style="display:inline-flex; padding:0.9rem 2rem; text-decoration:none; border-radius:10px; font-weight:600; font-size:1.1rem;">
                    Open in Google Drive <i class="fas fa-external-link-alt" style="margin-left: 8px;"></i>
                </a>
            `;
        }

        window.forceDownload = async function (url, filename) {
            try {
                const btn = document.getElementById('btn-download');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Downloading...</span>';

                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = objectUrl;
                a.download = filename || 'document.pdf';
                document.body.appendChild(a);
                a.click();

                document.body.removeChild(a);
                URL.revokeObjectURL(objectUrl);

                btn.innerHTML = originalHTML;
            } catch (e) {
                console.error("Forced download failed, falling back to new tab", e);
                window.open(url, '_blank');
                const btn = document.getElementById('btn-download');
                btn.innerHTML = '<i class="fas fa-download"></i> <span>Download</span>';
            }
        };

        window.shareNote = function () {
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const baseUrl = isLocal ? window.location.origin : 'https://skilmatrix.site';
            const urlParams = new URLSearchParams(window.location.search);
            const noteId = urlParams.get('id');
            const url = noteId ? (baseUrl + '/share/' + noteId) : (baseUrl + window.location.pathname + window.location.search);

            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: 'Check out this study resource on SKiL MATRiX!',
                    url: url
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    alert("Link copied to clipboard!");
                });
            }
        };


        async function renderPDF(url) {
            const container = document.getElementById('pdf-container');
            const pageIndicator = document.getElementById('page-indicator');
            const loader = document.getElementById('loader');

            container.style.display = 'block';
            pageIndicator.style.display = 'flex';

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;

                document.getElementById('total-pages').innerText = pdf.numPages;
                loader.style.display = 'none';

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper';
                    wrapper.dataset.pageNumber = pageNum;
                    wrapper.style.marginBottom = '20px';
                    wrapper.style.minHeight = '800px';
                    wrapper.style.display = 'flex';
                    wrapper.style.justifyContent = 'center';

                    container.appendChild(wrapper);
                }

                const observer = new IntersectionObserver((entries) => {
                    // Update current page based on visible intersecting items
                    let topVisible = null;
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const wrapper = entry.target;
                            const pageNum = parseInt(wrapper.dataset.pageNumber);

                            // Naive way to just set to last intersecting we find in list
                            document.getElementById('current-page').innerText = pageNum;

                            if (!wrapper.dataset.rendered) {
                                wrapper.dataset.rendered = 'true';
                                renderPage(pdf, pageNum, wrapper);
                            }
                        }
                    });
                }, { root: container, rootMargin: '300px 0px' });

                document.querySelectorAll('.pdf-page-wrapper').forEach(w => observer.observe(w));

            } catch (err) {
                console.error("PDF.js render failed:", err);
                showError("Could not load PDF document.");
            }
        }

        function renderOffice(url) {
            const officeFrame = document.getElementById('office-frame');
            const loader = document.getElementById('loader');
            
            // Microsoft Office Online Viewer requires public, accessible URLs
            officeFrame.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
            
            officeFrame.onload = () => {
                loader.style.display = 'none';
            };
            
            officeFrame.style.display = 'block';
            
            // In case the iframe onload fails to fire or takes too long, hide loader after 3s
            setTimeout(() => {
                if (loader.style.display !== 'none') {
                    loader.style.display = 'none';
                }
            }, 3000);
        }

        async function renderPage(pdf, pageNum, wrapper) {
            try {
                const page = await pdf.getPage(pageNum);

                const container = document.getElementById('pdf-container');
                const containerWidth = container.clientWidth - 40;
                const targetWidth = Math.min(containerWidth, 900); // Prevent excessive zoom on desktop

                const unscaledViewport = page.getViewport({ scale: 1.0 });
                let scale = targetWidth / unscaledViewport.width;
                if (scale > 1.5) scale = 1.5; // max scale limit

                const viewport = page.getViewport({ scale: scale });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                canvas.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
                canvas.style.borderRadius = '4px';

                wrapper.style.minHeight = viewport.height + 'px';
                wrapper.innerHTML = ''; // clear
                wrapper.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
            } catch (e) {
                console.error(`Page ${pageNum} render error:`, e);
            }
        }

        // Initialize
        loadNote();</script></body></html>
