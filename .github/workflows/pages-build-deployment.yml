name: pages-build-deployment

# Deploy the site's static /pages directory to GitHub Pages using the official Pages actions.
# Verifies output, grants pages:write, and increases timeout to avoid "deployment_queued" timeouts.

on:
  push:
    branches:
      - main
      - master
      - "release/*"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm repository and list top-level files
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          ls -la

      - name: Build site (adjust to your project)
        run: |
          # If you have a build step, replace the commands below.
          if [ -f package.json ]; then
            npm ci || true
            npm run build || true
          fi
          echo "Candidate output dirs:"
          ls -la ./pages || true
          ls -la ./public || true
          ls -la ./dist || true

      - name: Verify pages directory exists
        id: check_pages
        run: |
          if [ -d "pages" ] && [ "$(find pages -type f | wc -l)" -gt 0 ]; then
            echo "pages_exists=true" >> $GITHUB_OUTPUT
            echo "Pages directory contents:" && ls -la pages | sed -n '1,200p'
          else
            echo "pages_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if pages directory missing
        if: steps.check_pages.outputs.pages_exists != 'true'
        run: |
          echo "Error: 'pages' directory not found or empty. Ensure your build outputs into 'pages/' or update the workflow path."
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
