        const log = (msg) => { document.getElementById('log').innerHTML += msg + '\\n'; };

        async function migrate() {
            log('Starting migration...');
            const college_id = 'medicaps';

            for (const key of Object.keys(subjectsData)) {
                const parts = key.split('-'); // e.g. 'cse', 'Semester 5'
                if (parts.length < 2) continue;
                
                const branch_id = parts[0].trim();
                const semester = parts[1].trim();

                const subs = subjectsData[key];
                
                for (const sub of subs) {
                    log(`Inserting ${sub.name} for ${branch_id} ${semester}...`);
                    
                    const { error } = await supabase.from('college_subjects').upsert({
                        college_id,
                        branch_id,
                        semester,
                        subject_name: sub.name,
                        subject_code: sub.code || 'SUB',
                        icon: sub.icon || '📚',
                        description: sub.description || '',
                        syllabus: sub.description || '',
                        created_by: 'system_migration'
                    }, { onConflict: 'college_id,branch_id,semester,subject_name' });
                    
                    if (error) {
                        log(`ERROR on ${sub.name}: ${error.message}`);
                    } else {
                        log(`SUCCESS: ${sub.name}`);
                    }
                }
            }
            log('MIGRATION COMPLETE!');
        }
