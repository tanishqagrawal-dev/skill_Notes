[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://skillnotes.netlify.app/*"
  to = "https://skilmatrix.site/:splat"
  status = 301
  force = true

# Auth Redirects
[[redirects]]
  from = "/login"
  to = "/pages/auth.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/pages/auth.html"
  status = 200

[[redirects]]
  from = "/pages/login"
  to = "/pages/auth.html"
  status = 200

[[redirects]]
  from = "/pages/auth/*"
  to = "/pages/auth.html"
  status = 200

# App Routing
[[redirects]]
  from = "/pages/dashboard/*"
  to = "/pages/dashboard.html"
  status = 200

[[redirects]]
  from = "/pages/codetantra/*"
  to = "/pages/codetantra.html"
  status = 200

[[redirects]]
  from = "/notes/*"
  to = "/pages/notes.html"
  status = 200

[[redirects]]
  from = "/share/*"
  to = "https://skil-matrix-server.onrender.com/api/share/:splat"
  status = 200

[[redirects]]
  from = "/subscription"
  to = "https://skil-matrix-server.onrender.com/api/subscription-seo"
  status = 200

# HTML Headers - Instant updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# JS & CSS Headers - Revalidate on every deploy
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

