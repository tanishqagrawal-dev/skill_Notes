                    window.authStatus = {
                        ready: true,
                        data: {

                            currentUser: parsed
                        }
                    };
                    window.dispatchEvent(new CustomEvent('auth-ready', { detail: window.authStatus.data }));
                }
            } catch (e) { }
        })();
    </script>

    <!-- SaaS-Grade Refined Fake Analytics Engine (Identity-Based) -->
    <script>
        window.runAnalyticsSimulation = function () {
            console.log("📈 Running Identity-Based Analytics Simulation...");
            const VIEW_GROWTH = 20;
            const LIKE_GROWTH = 1;

            // create hash from title text
            function makeId(text) {
                return "note_" + text.replace(/\s+/g, '_').toLowerCase();
            }

            document.querySelectorAll(".note-card-pro").forEach(card => {
                const titleEl = card.querySelector("h3");
                if (!titleEl) return;

                const id = makeId(titleEl.innerText);
                const viewEl = card.querySelector(".views");
                const likeEl = card.querySelector(".like");
                if (!viewEl || !likeEl) return;

                let data = JSON.parse(localStorage.getItem(id));
                const today = new Date().toDateString();

                if (!data) {
                    data = {
                        views: Math.floor(Math.random() * 150) + 30,
                        likes: Math.floor(Math.random() * 12) + 1,
                        active: Math.random() > 0.3, // some start paused
                        last: today
                    };
                }

                if (data.last !== today) {
                    const mood = Math.random();
                    if (data.active) {
                        if (mood < 0.65) {
                            // grow (MAIN RULE)
                            data.views += VIEW_GROWTH;
                            data.likes += LIKE_GROWTH;
                        } else {
                            // pause today
                            data.active = false;
                        }
                    } else {
                        // resume chance
                        if (mood < 0.25) {
                            data.active = true;
                        }
                    }
                    data.last = today;
                }

                localStorage.setItem(id, JSON.stringify(data));

                // Update UI: "X Views" and "Y"
                viewEl.innerText = data.views + " Views";
                likeEl.innerText = data.likes;
            });
        };

        // Initial run after content settles
        setTimeout(window.runAnalyticsSimulation, 2500);
    </script>

    <!-- Auth Lifecycle & Logout -->
    <script type="module">
        import { initAuth } from '../js/auth.js';

        // Boot up real Firebase auth in background
        // requestIdleCallback keeps the immediate load fast
        const bootAuth = () => {
            console.log("🔐 Initializing Auth Lifecycle...");
            initAuth();
        };

        if ('requestIdleCallback' in window) {
            requestIdleCallback(bootAuth);
        } else {
            setTimeout(bootAuth, 200);
        }
    </script>
