            <script>
                    /**
                     * ⚡ Pro Dashboard Hydration Engine
                     * Synchronizes sidebar and greeting with ultra-fast local states
                     */
                    window.hydrateDashboardUI = function() {
                        const raw = localStorage.getItem('auth_user_full') || localStorage.getItem('guest_session');
                        if (!raw) return;

                        try {
                            const u = JSON.parse(raw);
                            
                            // 1. Sidebar Sync
                            const nameEl = document.getElementById('instant-name');
                            const roleEl = document.getElementById('instant-role');
                            const avEl = document.getElementById('instant-avatar');
                            
                            if (nameEl) nameEl.innerText = u.name || 'Scholar';
                            if (roleEl) roleEl.innerText = (u.role || 'USER').toUpperCase();
                            
                            if (avEl) {
                                if (u.photo && !u.photo.startsWith('blob:')) {
                                    avEl.innerHTML = `<img src="${u.photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" onerror="this.style.display='none'; this.parentElement.innerText='${(u.name || 'U').charAt(0)}'">`;
                                } else {
                                    avEl.innerText = (u.name || 'U').charAt(0);
                                    avEl.style.display = 'flex';
                                    avEl.style.alignItems = 'center';
                                    avEl.style.justifyContent = 'center';
                                }
                            }

                            // 2. Greeting Sync
                            const titleEl = document.getElementById('welcome-title');
                            const metaEl = document.getElementById('welcome-meta');
                            
                            if (titleEl || metaEl) {
                                const firstName = (u.name || 'Scholar').split(' ')[0];
                                const college = u.collegeName || u.college || 'Medicaps University';
                                
                                // Beautiful year formatting (Handle numbers and strings)
                                let y = String(u.year || '');
                                let yLabel = y;
                                if (y === '1') yLabel = '1st Year';
                                else if (y === '2') yLabel = '2nd Year';
                                else if (y === '3') yLabel = '3rd Year';
                                else if (y === '4') yLabel = '4th Year';
                                else if (y && !y.toLowerCase().includes('year')) yLabel = y + ' Year';
                                else if (!y) yLabel = 'Scholar';

                                const branch = (u.branch || 'CSE').toUpperCase();
                                const roleText = u.role !== 'user' ? `🛡️ Verified ${u.role.toUpperCase()}` : `${yLabel} • ${branch}`;

                                if (titleEl && !titleEl.innerHTML.includes('Welcome')) {
                                    titleEl.innerHTML = `Welcome back, <span class="gradient-text">${firstName}</span> <span class="waving-hand">👋</span>`;
                                }
                                if (metaEl) metaEl.innerText = `${roleText} • ${college}`;
                            }
                        } catch (e) { console.error("Hydration Error:", e); }
                    };

                    // Run immediately for instant paint
                    window.hydrateDashboardUI();
                    
                    // Also run on auth-ready to refresh with latest data
                    window.addEventListener('auth-ready', window.hydrateDashboardUI);
            </script>

    <!-- SaaS-Grade Refined Fake Analytics Engine (Identity-Based) -->
    <script>
        window.runAnalyticsSimulation = function () {
            console.log("📈 Running Identity-Based Analytics Simulation...");
            const VIEW_GROWTH = 20;
            const LIKE_GROWTH = 1;

            // create hash from title text
            function makeId(text) {
                return "note_" + text.replace(/\s+/g, '_').toLowerCase();
            }

            document.querySelectorAll(".note-card-pro").forEach(card => {
                const titleEl = card.querySelector("h3");
                if (!titleEl) return;

                const id = makeId(titleEl.innerText);
                const viewEl = card.querySelector(".views");
                const likeEl = card.querySelector(".like");
                if (!viewEl || !likeEl) return;

                let data = JSON.parse(localStorage.getItem(id));
                const today = new Date().toDateString();

                if (!data) {
                    data = {
                        views: Math.floor(Math.random() * 150) + 30,
                        likes: Math.floor(Math.random() * 12) + 1,
                        active: Math.random() > 0.3, // some start paused
                        last: today
                    };
                }

                if (data.last !== today) {
                    const mood = Math.random();
                    if (data.active) {
                        if (mood < 0.65) {
                            // grow (MAIN RULE)
                            data.views += VIEW_GROWTH;
                            data.likes += LIKE_GROWTH;
                        } else {
                            // pause today
                            data.active = false;
                        }
                    } else {
                        // resume chance
                        if (mood < 0.25) {
                            data.active = true;
                        }
                    }
                    data.last = today;
                }

                localStorage.setItem(id, JSON.stringify(data));

                // Update UI: "X Views" and "Y"
                viewEl.innerText = data.views + " Views";
                likeEl.innerText = data.likes;
            });
        };

        // Initial run after content settles
        setTimeout(window.runAnalyticsSimulation, 2500);
    </script>
