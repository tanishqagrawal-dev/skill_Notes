<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KSCJTPP875"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KSCJTPP875');
    </script>
    <link rel="shortcut icon" href="../assets/logo.jpg" type="image/jpeg">
    <title>Dashboard | SKiL MATRiX Notes</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/advanced_dashboard.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/lockOverlay.css">
</head>

<body class="dashboard-body">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-card">
            <div class="sidebar-header" style="display: flex; align-items: center; gap: 10px;">
                <img src="../assets/logo.jpg" alt="SKiL MATRiX" style="height: 40px; border-radius: 50%;">
                <span class="logo-text font-heading" style="font-size: 1.2rem;">SKiL MATRiX <span class="highlight"
                        style="font-weight: 800;">NOTES</span></span>
            </div>
            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-item">
                    <span class="icon">⬅️</span> Back to Home
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item active" data-tab="overview">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="#" class="nav-item" data-tab="notes">
                    <span class="icon">📚</span> Notes Hub
                </a>
                <a href="#" class="nav-item locked" data-tab="planner">
                    <span class="icon">📅</span> Study Planner
                </a>
                <a href="#" class="nav-item locked" data-tab="ai-tools">
                    <span class="icon">🤖</span> AI Tools
                </a>
                <a href="#" class="nav-item" data-tab="private-drive">
                    <span class="icon">🔐</span> Private Drive
                </a>
                <a href="#" class="nav-item" data-tab="leaderboard">
                    <span class="icon">🏆</span> Leaderboard
                </a>
                <a href="#" class="nav-item" data-tab="admin" id="admin-tab" style="display: none;">
                    <span class="icon">⚡</span> Admin Console
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item" data-tab="settings">
                    <span class="icon">⚙️</span> Settings
                </a>
            </nav>
            <div class="user-profile-mini">
                <div class="avatar" id="instant-avatar">...</div>
                <div class="user-info">
                    <span class="name" id="instant-name">Loading...</span>
                    <span class="meta" id="instant-role"
                        style="font-size: 0.75rem; color: var(--text-dim); display: block;">Profile</span>
                </div>
            </div>
            <script>
                // --- 00. SIDEBAR HYDRATION (Blocking for instant paint) ---
                (function () {
                    const raw = localStorage.getItem('auth_user_full') || localStorage.getItem('guest_session');
                    if (raw) {
                        try {
                            const u = JSON.parse(raw);
                            document.getElementById('instant-name').innerText = u.name || (u.email ? u.email.split('@')[0] : 'Scholar');
                            document.getElementById('instant-role').innerText = (u.role || 'USER').toUpperCase();
                            const av = document.getElementById('instant-avatar');
                            if (u.photo) av.innerHTML = `<img src="${u.photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                            else av.innerText = (u.name || 'U').charAt(0);
                        } catch (e) { }
                    }
                })();
            </script>
        </aside>

        <!-- Private Drive Content -->
        <div id="private-drive" class="tab-content" style="display: none;">
            <!-- Content injected by JS -->
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar glass-card">
                <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                    <div class="mobile-dashboard-toggle" id="sidebar-toggle-btn" style="display: none;">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="search-bar" style="flex: 1;">
                        <input type="text" id="global-search-input" name="q" placeholder="Search notes...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
                <div class="top-actions">
                    <button class="btn btn-ghost notification-btn">🔔</button>
                    <button class="primary-btn upload-btn">+ Upload Note</button>
                </div>
            </header>

            <style>
                @media (max-width: 768px) {
                    #sidebar-toggle-btn {
                        display: flex !important;
                    }

                    .top-bar {
                        padding: 0.75rem 0.5rem !important;
                    }
                }
            </style>

            <script>
                document.getElementById('sidebar-toggle-btn')?.addEventListener('click', () => {
                    document.querySelector('.sidebar')?.classList.toggle('active');
                });

                // Close sidebar on item click
                document.querySelectorAll('.sidebar .nav-item').forEach(item => {
                    item.addEventListener('click', () => {
                        document.querySelector('.sidebar')?.classList.remove('active');
                    });
                });
            </script>

            <div class="content-area" id="tab-content">
                <script>
                    (function () {
                        const raw = localStorage.getItem('auth_user_full') || localStorage.getItem('guest_session');
                        const cachedUser = raw ? JSON.parse(raw) : null;
                        const rawStats = localStorage.getItem('cached_stats');
                        const stats = rawStats ? JSON.parse(rawStats) : null;

                        const name = cachedUser ? (cachedUser.name || 'Scholar').split(' ')[0] : '...';
                        const college = cachedUser ? (cachedUser.collegeName || cachedUser.college || 'Medicaps University') : 'Loading...';
                        const roleLabel = cachedUser ? (cachedUser.role !== 'user' ? `🛡️ Verified ${cachedUser.role.toUpperCase()}` : `${cachedUser.year || '3rd Year'} • ${cachedUser.branch || 'CSE'}`) : 'Loading Profile...';

                        document.write(`
                            <div id="instant-view" class="tab-pane active fade-in dashboard-welcome-pane">
                                <div class="welcome-header">
                                    <h1 class="font-heading">
                                        ${cachedUser ? `Welcome back, <span class="gradient-text">${name}</span> <span class="waving-hand">👋</span>` : `<div class="skeleton" style="height: 48px; width: 300px; border-radius: 8px;"></div>`}
                                    </h1>
                                    <p>
                                        ${cachedUser ? `${roleLabel} • ${college}` : `<div class="skeleton" style="height: 20px; width: 250px; margin-top: 10px;"></div>`}
                                    </p>
                                </div>
                                
                                <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
                                    <div class="glass-card" style="padding: 1.5rem; border-left: 4px solid #2ecc71;">
                                        <div style="font-size: 0.9rem; color: var(--text-dim);">🔴 Live Students</div>
                                        <div style="font-size: 2.5rem; font-weight: 700; margin-top:0.5rem;">${stats ? stats.totalStudents : '--'}</div>
                                    </div>
                                    <div class="glass-card" style="padding: 1.5rem; border-left: 4px solid #3498db;">
                                        <div style="font-size: 0.9rem; color: var(--text-dim);">🔥 Global Views</div>
                                        <div id="stat-views" style="font-size: 2.5rem; font-weight: 700; margin-top:0.5rem;">${stats ? stats.totalViews : '--'}</div>
                                    </div>
                                    <div class="glass-card" style="padding: 1.5rem; border-left: 4px solid #9b59b6;">
                                        <div style="font-size: 0.9rem; color: var(--text-dim);">⬇️ Global Downloads</div>
                                        <div style="font-size: 2.5rem; font-weight: 700; margin-top:0.5rem;">${stats ? stats.totalDownloads : '--'}</div>
                                    </div>
                                </div>

                                <div class="glass-card" style="background: linear-gradient(135deg, rgba(108,99,255,0.05) 0%, rgba(255,255,255,0.01) 100%); padding: 3rem; border-radius: 24px; text-align: center;">
                                    <div class="loader-pro" style="margin: 0 auto 1.5rem;"></div>
                                    <p style="color: var(--text-dim);">Synchronizing your educational workspace...</p>
                                </div>
                            </div>
                        `);
                    })();
                </script>
            </div>
        </main>
    </div>

    <!-- Back to Top -->
    <button id="back-to-top" class="btn-icon-round" aria-label="Back to Top">↑</button>

    <!-- Application Engine -->
    <script>
        window.authStatus = { ready: false, data: null };
        (function () {
            try {
                const raw = localStorage.getItem('auth_user_full') || localStorage.getItem('guest_session');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    window.authStatus = {
                        ready: true,
                        data: {
                            user: { uid: parsed.id, email: parsed.email, displayName: parsed.name },
                            currentUser: parsed
                        }
                    };
                    window.dispatchEvent(new CustomEvent('auth-ready', { detail: window.authStatus.data }));
                }
            } catch (e) { }
        })();
    </script>

    <script type="module" src="../js/firebase-config.js"></script>
    <script src="../js/ai-client.js" defer></script>
    <script src="../js/settings.js" defer></script>
    <script src="../js/upload-helper.js" defer></script>
    <script type="module">
        import { initRealtimeStats } from '../js/stats.js';
        initRealtimeStats();
    </script>
    <script src="../js/admin-console.js" defer></script>
    <script src="../js/coadmin-module.js" defer></script>
    <script src="../js/note-actions.js" defer></script>
    <script src="../js/lockOverlay.js" defer></script>
    <script type="module" src="../js/notes-hub.js" defer></script>
    <script src="../js/footer.js" defer></script>
    <script type="module" src="../js/dashboard.js"></script>

    <!-- Auth Lifecycle & Logout -->
    <script type="module">
        import { initAuth } from '../js/auth.js';

        // Boot up real Firebase auth in background
        // requestIdleCallback keeps the immediate load fast
        const bootAuth = () => {
            console.log("🔐 Initializing Auth Lifecycle...");
            initAuth();
        };

        if ('requestIdleCallback' in window) {
            requestIdleCallback(bootAuth);
        } else {
            setTimeout(bootAuth, 200);
        }
    </script>
</body>

</html>
