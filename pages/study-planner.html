<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner | SKiL MATRiX Notes</title>
    <link rel="stylesheet" href="../css/main.css?v=3.0">
    <link rel="stylesheet" href="../css/lockOverlay.css?v=3.0">
    <style>
        body {
            background: #05070a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .bg-placeholder {
            font-family: 'Poppins', sans-serif;
            opacity: 0.1;
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="bg-placeholder">STUDY PLANNER</div>

    <script src="../js/lockOverlay.js?v=3.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.lockOverlay.show();
        });
    </script>
    <!-- Voiceflow Chatbot -->
    <script type="text/javascript">
        (function (d, t) {
            var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
            v.onload = function () {
                window.voiceflow.chat.load({
                    verify: { projectID: '67a8c08ad2483de383f344c4' },
                    url: 'https://general-runtime.voiceflow.com',
                    versionID: 'production',
                    voice: {
                        url: "https://runtime-api.voiceflow.com"
                    }
                });
            }
            v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
        })(document, 'script');
    </script>
</body>

</html>
