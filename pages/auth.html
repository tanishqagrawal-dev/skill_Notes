<body style="min-height: 100vh;">
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">SKiL MATRiX Authentication</h1>

    <div class="auth-container">
        <!-- LOGIN CARD -->
        <div id="login-card" class="auth-card fade-in">
            <header class="auth-header" style="text-align: center;">
                <div class="auth-logo">
                    <img src="../assets/logo.jpg?v=7.0" alt="SKiL MATRiX">
                    <span>SKiL <span class="highlight">MATRiX</span></span>
                </div>
                <h2>Welcome back</h2>
                <p>Enter your email below to sign in to your account</p>
            </header>

            <div class="role-toggle-container" id="role-toggle">
                <div class="role-toggle-bg"></div>
                <button type="button" class="role-btn active" id="btn-student" onclick="setRole('student')">Student</button>
                <button type="button" class="role-btn" id="btn-admin" onclick="setRole('admin')">Admin</button>
            </div>
            
            <div id="auth-error-msg"></div>

            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="login-email" placeholder="name@example.com" required autocomplete="new-password" name="email_fake_name_to_disable_autofill">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword(event)">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth btn-login">
                    Sign In 
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 4px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <div class="divider">OR CONTINUE WITH</div>

            <div class="social-buttons">

                        <path

                            fill="#34A853" />
                        <path

                            fill="#EA4335" />

                    Google

                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" fill="currentColor"/>

            <div class="auth-footer">
                Don't have an account? <a href="#" onclick="toggleAuthMode('signup')">Sign up</a>

        <!-- SIGNUP CARD (Hidden by default) -->
        <div id="signup-card" class="auth-card fade-in hidden">
            <header class="auth-header" style="text-align: center;">

                    <img src="../assets/logo.jpg?v=7.0" alt="SKiL MATRiX">
                    <span>SKiL <span class="highlight">MATRiX</span></span>

                <h2>Join Success</h2>
                <p>Create your SKiL MATRiX account</p>
            </header>

            <form id="signup-form" class="auth-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="signup-name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="signup-email" placeholder="skilmatrix3@gmail.com" required autocomplete="new-password">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="signup-password" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-auth btn-login">CREATE ACCOUNT</button>
            </form>

            <div class="divider">OR</div>

            <button class="btn-auth btn-secondary" onclick="toggleAuthMode('login')">
                Already have an account? Log In
            </button>

        </div>

    <script type="module">
        import { initAuth } from '../js/auth.js?v=6.0';
        // Initialize Auth Listeners (Forms, Google Btn)
        initAuth();

        // Track Auth Page View
        if (typeof gtag === 'function') {
            gtag('event', 'page_view', { page_title: 'Authentication', page_path: '/auth' });
        }
    </script>
    <script>
        // Star Field Background Generator
        const starsContainer = document.getElementById('stars');
        const count = 150;
        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        function toggleAuthMode(mode) {
            const loginCard = document.getElementById('login-card');
            const signupCard = document.getElementById('signup-card');
            if (mode === 'signup') {
                loginCard.classList.add('hidden');
                signupCard.classList.remove('hidden');
            } else {
                signupCard.classList.add('hidden');
                loginCard.classList.remove('hidden');
            }
        }

        // Role Toggle Logic
        window.selectedLoginRole = 'student';
        
        function setRole(role) {
            window.selectedLoginRole = role;
            const toggleContainer = document.getElementById('role-toggle');
            const btnStudent = document.getElementById('btn-student');
            const btnAdmin = document.getElementById('btn-admin');
            
            if (role === 'admin') {
                toggleContainer.classList.add('admin-active');
                btnStudent.classList.remove('active');
                btnAdmin.classList.add('active');
            } else {
                toggleContainer.classList.remove('admin-active');
                btnAdmin.classList.remove('active');
                btnStudent.classList.add('active');
            }
            // Clear any old errors
            const errorMsg = document.getElementById('auth-error-msg');
            if (errorMsg) errorMsg.style.display = 'none';
        }

        // Forgot Password Logic
        window.handleForgotPassword = function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value;
            if (!emailInput) {
                alert("Please enter your email address first, then click 'Forgot password?'.");
                return;
            }
            if (window.triggerPasswordReset) {
                window.triggerPasswordReset(emailInput);
            }
        };
    </script>
