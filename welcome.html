<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="assets/logo_transparent.png" type="image/png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SKiL MATRiX | Intelligence Behind the Talent</title>
    
    <!-- EmailJS CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("OAr7OI7eqgchcs-QV");
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #7B61FF;
            --secondary: #00F2FF;
            --accent: #FF2D95;
            --bg-dark: #05070A;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1b26 0%, #05070a 100%);
            z-index: -2;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            animation: float 20s infinite alternate;
        }

        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: linear-gradient(135deg, var(--accent), var(--primary)); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        /* Particle System Simulation */
        .particles {
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }

        /* Join Card */
        .join-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            perspective: 1000px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border-color: rgba(123, 97, 255, 0.3);
        }

        /* Header */
        .logo-box {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            animation: logoFloat 4s infinite ease-in-out;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(123, 97, 255, 0.4);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: var(--secondary);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .hint {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-bottom: 2.5rem;
        }

        /* Form Styling */
        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.1rem 1.5rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(123, 97, 255, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-join {
            width: 100%;
            padding: 1.1rem;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px -5px rgba(123, 97, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn-join:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px -5px rgba(123, 97, 255, 0.6);
        }

        .btn-join:active {
            transform: scale(0.98);
        }

        .btn-join::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
        }

        .btn-join:hover::after {
            left: 100%;
        }

        #status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 20px;
            transition: all 0.3s;
        }

        .status-sending { color: var(--secondary); }
        .status-success { color: #00FF94; text-shadow: 0 0 10px rgba(0, 255, 148, 0.3); }
        .status-error { color: #FF4757; }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .glass-card {
                padding: 2.5rem 1.5rem;
                border-radius: 24px;
            }
            h1 { font-size: 1.6rem; }
            .join-container { max-width: 100%; }
        }
    </style>

    <!-- Structured Data for AdSense & SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://skilmatrix.site/#website",
          "url": "https://skilmatrix.site/",
          "name": "SKiL MATRiX",
          "description": "The ultimate study platform for engineering students.",
          "publisher": {
            "@id": "https://skilmatrix.site/#organization"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://skilmatrix.site/#organization",
          "name": "SKiL MATRiX",
          "url": "https://skilmatrix.site/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://skilmatrix.site/assets/logo.jpg"
          }
        }
      ]
    }
    </script>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="particles" id="particle-container"></div>

    <div class="join-container">
        <div class="glass-card">
            <div class="logo-box">
                <img src="https://skilmatrix.site/assets/logo.jpg?v=7.0" alt="SKiL MATRiX Logo">
            </div>
            
            <p class="tagline">Intelligence Behind the Talent.</p>
            <h1>Welcome to SKiL MATRiX</h1>
            <p class="hint">Join & Receive Welcome Email</p>

            <form id="joinForm">
                <div class="form-group">
                    <input type="text" name="user_name" placeholder="Enter Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Enter Email Address" required>
                </div>
                
                <button type="submit" class="btn-join" id="submitBtn">Join Now</button>
                
                <div id="status"></div>
            </form>
        </div>
    </div>

    <script>
        // Particle Generation
        const particleContainer = document.getElementById('particle-container');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 4 + 2 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            particle.style.top = Math.random() * 100 + '%';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 4 + 's';
            particleContainer.appendChild(particle);
        }

        // Form Handling
        const joinForm = document.getElementById('joinForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const titleEl = document.querySelector('h1');
        const taglineEl = document.querySelector('.tagline');

        function triggerSend(formData, isFirstTime = true) {
            const realUser = localStorage.getItem('auth_user_full');
            
            // --- GUEST PROTECTION: Only skip if there's NO real logged-in user ---
            if (!realUser && localStorage.getItem('guest_session')) {
                console.log("🛡️ Guest User detected (no real account). Skipping email trigger.");
                setTimeout(() => { window.location.href = "pages/dashboard.html"; }, 1000);
                return;
            }
            
            // If real user is now logged in, clear stale guest_session to avoid future conflicts
            if (realUser && localStorage.getItem('guest_session')) {
                localStorage.removeItem('guest_session');
                console.log("🧹 Cleared stale guest_session for logged-in user.");
            }
            
            console.log("📨 Attempting to send packet:", formData);
            
            // --- STRICT ONE-TIME ONLY LOGIC (scoped per user email) ---
            const userEmail = formData ? formData.email : 'unknown';
            const lastSentKey = `last_mail_sent_${userEmail.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const lastSentTime = localStorage.getItem(lastSentKey);
            // Scope has_received_welcome per user email so different users on same device work
            const hasReceivedLocal = localStorage.getItem(`has_received_welcome_${userEmail.replace(/[^a-zA-Z0-9]/g, '_')}`);

            if (lastSentTime || hasReceivedLocal) {
                console.log("🛡️ One-Time Protection: Welcome email already sent to this user. Skipping.");
                statusDiv.innerHTML = `<span class="status-success">✅ Session Verified! Redirecting...</span>`;
                setTimeout(() => {
                    window.location.href = "pages/dashboard.html";
                }, 1500);
                return;
            }

            // UI Feedback
            statusDiv.innerHTML = `<span class="status-sending">🚀 ${isFirstTime ? 'Sending Welcome Packet...' : 'Sending Welcome Back kit...'}</span>`;
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            // EmailJS Send
            emailjs.send(
                "service_u74i9ii", 
                "template_jm0zdru", 
                formData,
                "OAr7OI7eqgchcs-QV" // Passing Public Key directly for reliability
            ).then(
                function(response) {
                    console.log("✅ EmailJS Success:", response.status, response.text);
                    statusDiv.innerHTML = `<span class="status-success">✅ ${isFirstTime ? 'Welcome Email Sent!' : 'Welcome Back Packet Sent!'}</span>`;
                    
                    // Update flags and timestamps (scoped per user email)
                    localStorage.setItem(lastSentKey, Date.now().toString());
                    if (isFirstTime) {
                        localStorage.setItem(`has_received_welcome_${userEmail.replace(/[^a-zA-Z0-9]/g, '_')}`, 'true');
                    }
                    
                    setTimeout(() => {
                        window.location.href = "pages/dashboard.html";
                    }, 2000);
                }, 
                function(error) {
                    console.error('❌ EmailJS Error:', error);
                    statusDiv.innerHTML = `<span class="status-error">❌ Error: ${error.text || 'Check console'}</span>`;
                    
                    // Fallback redirect so user isn't stuck
                    setTimeout(() => {
                        console.log("🔄 Redirecting to dashboard despite mail failure...");
                        window.location.href = "pages/dashboard.html";
                    }, 4000);
                }
            );
        }

        joinForm.onsubmit = function(e) {
            e.preventDefault();
            const data = {
                user_name: this.user_name.value,
                email: this.email.value
            };
            triggerSend(data, true);
        };

        // --- INTELLIGENT ROUTING LOGIC ---
        window.addEventListener('DOMContentLoaded', () => {
            const raw = localStorage.getItem('auth_user_full') || localStorage.getItem('guest_session');
            const hasReceived = localStorage.getItem('has_received_welcome');

            if (raw) {
                try {
                    const user = JSON.parse(raw);
                    if (user.name && user.email) {
                        joinForm.style.display = 'none';
                        
                        if (!hasReceived) {
                            // CASE 1: NEW USER (First time login)
                            taglineEl.innerText = "The Future Starts Here.";
                            titleEl.innerHTML = `Welcome to <span style="color:var(--primary)">SKiL MATRiX</span>`;
                            document.querySelector('.hint').innerText = `Sending your welcome kit to ${user.email || 'your email'}...`;
                            
                            setTimeout(() => {
                                triggerSend({
                                    user_name: user.name || "Scholar",
                                    email: user.email || "",
                                    subject_prefix: "Welcome"
                                }, true);
                            }, 1200);
                        } else {
                            // CASE 2: OLD USER (Returning)
                            taglineEl.innerText = "Good to see you again!";
                            titleEl.innerHTML = `Welcome back, <span style="color:var(--secondary)">${(user.name || "Scholar").split(' ')[0]}</span>`;
                            document.querySelector('.hint').innerText = "Loading dashboard...";
                            
                            setTimeout(() => {
                                window.location.href = "pages/dashboard.html";
                            }, 1200);
                        }
                    }
                } catch (e) { console.warn("Identity check failed:", e); }
            }
        });
    </script>
</body>
</html>
